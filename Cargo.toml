[package]
name = "v6drop"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "ws", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.5", default-features = false, features = ["cors"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
dotenvy = "0.15"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Tối ưu hoá triệt để cho môi trường ít RAM (Render Free 512MB / VPS 128MB)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
